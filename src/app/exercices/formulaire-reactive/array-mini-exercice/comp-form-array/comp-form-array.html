<form [formGroup]="form" (ngSubmit)="handleOnSubmit()">
    <div class="form-group">
        <label for="name">Name :</label>
        <input name="name" type="text" formControlName="name"/>
    </div>
    <div>
        <label for="skills">Skills : {{skillInputs.length}}</label>
        <div class="form-array" formArrayName="skills">
            @for (skill of skillInputs.controls; track skill; let i=$index) {
                <div class="form-group">
                    <input type="text" [formControlName]="i"/>
                    <button type="button" (click)="removeSkillInput(i)" [disabled]="i<1">-</button>
                    <button type="button" (click)="addSkillInput()">+</button>
                </div>
            }
        </div>
    </div>
    <input type="submit" [disabled]="form.invalid"/>
</form>
