<form [formGroup]="form">
    <div class="form-group">
        <label for="name">Name :</label>
        <input name="name" type="text" formControlName="name"/>
    </div>
    <div>
        <label for="skills">Skills : {{skillInputs.length}}</label>
        <div class="form-array" formArrayName="skills">
            @for (skill of skillInputs.value; track $index;) {
                <div class="form-group">
                    <input type="text" [formControlName]="$index"/>
                    <button (click)="removeSkillInput($index)" [disabled]="$index<1">-</button>
                    <button (click)="addSkillInput()">+</button>
                </div>
            }
        </div>
    </div>
</form>
