<form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="form-group-line">
        <label for="firstname">Firstname :</label>
        <input type="text" id="firstname" formControlName="firstname"/>
    </div>
    <!-- @if(form.controls.firstname.touched && form.controls.firstname.errors) {
        @for (error of form.controls.firstname.errors; track $index) {
            <p>{{error}}</p>
        }
    } -->
    <div class="form-group-line">
        <label for="lastname">Lastname :</label>
        <input type="text" id="lastname" formControlName="lastname"/>
    </div>
    <div class="form-group-line">
        <label for="email">Email :</label>
        <input type="email" id="email" formControlName="email"/>
    </div>
    <div class="form-group-line">
        <label for="age">Age :</label>
        <input type="number" id="age" formControlName="age"/>
    </div>
    <p>Address</p>
    <div formGroupName="address">
        <div class="form-group-line">
            <label for="street">Street :</label>
            <input type="text" id="street" formControlName="street"/>
        </div>
        <div class="form-group-line">
            <label for="city">City :</label>
            <input type="text" id="city" formControlName="city"/>
        </div>
        <div class="form-group-line">
            <label for="zipcode">ZipCode :</label>
            <input type="number" id="zipcode" formControlName="zipcode"/>
        </div>
    </div>

    <button type="submit" [disabled]="form.invalid">Submit</button>
    <button type="button" (click)="fillFirstnameAndCity()">Fill Firstname & City</button>
</form>
